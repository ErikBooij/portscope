name: RabbitMQ compatibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rabbit-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  amqp-091:
    name: RabbitMQ ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["3.13.7", "4.0.9", "4.1.8", "4.2.9", "4.3.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise Portscope AMQP 0-9-1 termination
        run: ./scripts/test-rabbit-matrix.sh "${{ matrix.version }}"

name: PostgreSQL compatibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: postgres-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-v3:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise Portscope against PostgreSQL ${{ matrix.postgres }}
        run: ./scripts/test-postgres-matrix.sh "${{ matrix.postgres }}"

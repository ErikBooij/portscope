name: MongoDB compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wire-protocol:
    name: MongoDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["6.0.28", "7.0.40", "8.0.29", "8.3.8"]
    services:
      mongodb:
        image: mongo:${{ matrix.version }}
        env:
          MONGO_INITDB_ROOT_USERNAME: portscope_upstream
          MONGO_INITDB_ROOT_PASSWORD: upstream-secret
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Wait for MongoDB
        run: |
          for _ in $(seq 1 90); do
            if docker exec ${{ job.services.mongodb.id }} mongosh --quiet --username portscope_upstream --password upstream-secret --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 1
          done
          docker logs ${{ job.services.mongodb.id }}
          exit 1
      - name: Exercise Portscope MongoDB termination
        env:
          MONGO_MATRIX_ADDR: 127.0.0.1:27017
          MONGO_MATRIX_VERSION: ${{ matrix.version }}
        run: go test -tags=mongomatrix ./internal/proxy/mongoadapter -run '^TestRealMongoCompatibility$' -count=1

name: MongoDB compatibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mongo-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wire-protocol:
    name: MongoDB ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ["6.0.28", "7.0.40", "8.0.29", "8.3.8"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise Portscope MongoDB termination
        env:
          MONGO_MATRIX_VERSIONS: ${{ matrix.version }}
        run: ./scripts/test-mongo-matrix.sh

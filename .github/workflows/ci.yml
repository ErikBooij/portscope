name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: npm ci
      - name: Verify committed embedded frontend
        run: |
          npm run build
          git diff --exit-code -- internal/webui/dist
      - run: go test ./...
      - run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Verify formatting
        run: test -z "$(gofmt -l main.go internal)"
      - name: Verify source installation
        run: |
          go install .
          "$(go env GOPATH)/bin/portscope" --version
      - name: Verify cross-platform build
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -o /tmp/portscope.exe .

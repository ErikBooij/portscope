name: MySQL compatibility

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: mysql-compatibility-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classic-protocol:
    name: MySQL ${{ matrix.mysql }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mysql: ["5.6", "5.7", "8.0", "8.4", "9.7", "26.7"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Exercise Portscope against MySQL ${{ matrix.mysql }}
        run: ./scripts/test-mysql-matrix.sh "${{ matrix.mysql }}"

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

before:
  hooks:
    - go mod download
    - npm ci
    - npm run build

builds:
  - id: portscope
    main: .
    binary: portscope
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - >-
        -s -w
        -X github.com/erikbooij/portscope/internal/buildinfo.Version={{.Version}}
        -X github.com/erikbooij/portscope/internal/buildinfo.Commit={{.Commit}}
        -X github.com/erikbooij/portscope/internal/buildinfo.Date={{.CommitDate}}

archives:
  - id: release
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - SECURITY.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: false
  prerelease: auto
